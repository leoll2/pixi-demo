[workspace]
authors = ["Leonardo Lai <leonardo.lai@intel.com>"]
name = "object_detection_demo"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "*"

[feature.preprocess.dependencies]
python = "3.12.*"
pillow = ">=11,<12"

[feature.preprocess.tasks]
preprocess = { cmd = "python src/toolbox/preprocess.py", description = "Preprocess an input image" }

[feature.detect.dependencies]
python = "3.14.*"
pytorch = ">=2.12,<3"
torchvision = "*"

[feature.detect.pypi-dependencies]
ultralytics = ">=8.3,<9"

[feature.detect.tasks]
detect = { cmd = "python src/toolbox/detect.py", description = "Run YOLO object detection" }

[feature.annotate.dependencies]
opencv = ">=4.10,<5"

[feature.annotate.tasks]
annotate = { cmd = "python src/toolbox/annotate.py", description = "Draw detections on an image" }

[environments]
default = { solve-group = "main" }
preprocess = ["preprocess"]
detect = ["detect"]
annotate = ["annotate"]
